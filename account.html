
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل کاربری | StarCraft</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Tahoma, Arial;
  color: white;
  text-align: center;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, #54218b66, transparent 35%),
    radial-gradient(circle at 80% 70%, #172e8c66, transparent 35%),
    linear-gradient(135deg, #08051b, #15102e, #050817);
}

header {
  padding: 20px;
  border-bottom: 2px solid #9b65ff;
  background: #09051dcc;
}

.logo {
  width: min(220px, 75%);
  max-height: 140px;
  object-fit: contain;
}

h1, h2 { color: #d2b6ff; }

.panel {
  width: min(420px, 92%);
  margin: 40px auto;
  padding: 25px 18px;
  border: 1px solid #8055ff;
  border-radius: 16px;
  background: #17132be8;
  box-shadow: 0 0 25px #804cff33;
}

input {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  border: 1px solid #8055ff;
  border-radius: 8px;
  background: #0b0920;
  color: white;
  font-size: 15px;
}

button {
  padding: 12px 18px;
  margin: 5px;
  border: 1px solid #bca1ff;
  border-radius: 8px;
  background: linear-gradient(135deg, #8055ff, #426bff);
  color: white;
  font-size: 15px;
  cursor: pointer;
}

a { color: #cbb5ff; }

#message {
  line-height: 1.8;
  color: #cbb5ff;
}
</style>
</head>
<body>

<header>
  <img class="logo" src="starcraft-logo.jpg" alt="StarCraft">
  <h1>👤 پنل کاربری</h1>
  <p>به دنیای StarCraft خوش آمدی!</p>
</header>

<main class="panel">
  <h2>ورود / ثبت‌نام</h2>

  <input id="username" placeholder="نام کاربری ماینکرفت">

  <input id="email" type="email" placeholder="ایمیل">

  <input id="password" type="password" placeholder="رمز عبور">

  <button onclick="login()">ورود</button>
  <button onclick="register()">ثبت‌نام</button>

  <hr style="border-color:#40315f;margin:25px 0">

  <h2>📦 سفارش‌های من</h2>
  <button onclick="orders()">مشاهده سفارش‌ها</button>

  <p id="message"></p>

  <a href="index.html">⬅ بازگشت به فروشگاه</a>
</main>

<script>
function login() {
  document.getElementById('message').textContent =
    'ورود واقعی به سیستم هنوز راه‌اندازی نشده است.';
}

function register() {
  document.getElementById('message').textContent =
    'ثبت‌نام واقعی به پایگاه داده و سیستم حساب کاربری نیاز دارد.';
}

function orders() {
  document.getElementById('message').textContent =
    'برای نمایش سفارش‌های واقعی باید حساب کاربری و پایگاه داده متصل شوند.';
}
</script>

</body>
</html>
