<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://euvslrpmvevtiwhfdhio.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YvXvyId7Fmd30vyxyoCAMg_fZn-8gE9';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const toast = document.getElementById('toast');
const modal = document.getElementById('orderModal');
const form = document.getElementById('orderForm');
const message = document.getElementById('orderMessage');
const submitButton = document.getElementById('submitOrder');
const rankName = document.getElementById('rankName');
const playerName = document.getElementById('playerName');

let toastTimer;
let checkingLogin = false;

const prices = {
  VIP: 50000,
  MVP: 100000,
  SPONSER: 200000,
  STAR: 350000
};

function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 3500);
}

function showMessage(text, isSuccess = false) {
  message.textContent = text;
  message.className = isSuccess ? 'form-message ok' : 'form-message';
}

function closeOrderModal() {
  modal.classList.remove('open');
}

// بررسی حساب کاربر از Supabase
async function getLoggedInUser() {
  const { data, error } = await db.auth.getUser();

  if (error) {
    console.error('Authentication error:', error);
    throw error;
  }

  return data.user || null;
}

// اگر کاربر وارد نشده باشد، انتقال به پنل کاربری
function redirectToAccount() {
  showMessage('برای ثبت سفارش ابتدا وارد حساب کاربری شو.');

  setTimeout(() => {
    window.location.href = 'account/';
  }, 1200);
}

// منوی موبایل
const menuToggle = document.getElementById('menuToggle');
const navLinks = document.getElementById('navLinks');

menuToggle.addEventListener('click', () => {
  navLinks.classList.toggle('open');
  menuToggle.textContent =
    navLinks.classList.contains('open') ? '✕' : '☰';
});

navLinks.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    navLinks.classList.remove('open');
    menuToggle.textContent = '☰';
  });
});

// کپی آدرس سرور
document.getElementById('copyAddress').addEventListener('click', async () => {
  const address = document.getElementById('serverAddress').textContent.trim();

  try {
    await navigator.clipboard.writeText(address);
    showToast('آدرس کپی شد: ' + address);
  } catch {
    showToast('آدرس سرور: ' + address);
  }
});

// باز کردن فرم سفارش فقط برای کاربر واردشده
document.querySelectorAll('[data-rank]').forEach(button => {
  button.addEventListener('click', async () => {
    if (checkingLogin) return;

    checkingLogin = true;
    button.disabled = true;

    try {
      const user = await getLoggedInUser();

      if (!user) {
        window.location.href = 'account/';
        return;
      }

      rankName.value = button.dataset.rank;
      showMessage('');
      modal.classList.add('open');
      playerName.focus();

    } catch (error) {
      console.error(error);
      showToast('بررسی ورود ناموفق بود. اینترنت را بررسی و دوباره تلاش کن.');
    } finally {
      checkingLogin = false;
      button.disabled = false;
    }
  });
});

// بستن فرم
document.getElementById('closeOrder').addEventListener('click', closeOrderModal);

modal.addEventListener('click', event => {
  if (event.target === modal) closeOrderModal();
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeOrderModal();
});

// ثبت سفارش با بررسی مجدد حساب
form.addEventListener('submit', async event => {
  event.preventDefault();

  if (submitButton.disabled) return;

  const player = playerName.value.trim();
  const rank = rankName.value;

  if (!/^[A-Za-z0-9_]{3,16}$/.test(player)) {
    showMessage('نام بازیکن باید ۳ تا ۱۶ کاراکتر انگلیسی، عدد یا _ باشد.');
    return;
  }

  if (!Object.prototype.hasOwnProperty.call(prices, rank)) {
    showMessage('رنک انتخاب‌شده معتبر نیست.');
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = 'در حال بررسی...';
  showMessage('');

  try {
    // بررسی مجدد ورود هنگام ثبت سفارش
    const user = await getLoggedInUser();

    if (!user) {
      redirectToAccount();
      return;
    }

    const orderNumber = 'SC-' + crypto.randomUUID()
      .replace(/-/g, '')
      .slice(0, 12)
      .toUpperCase();

    // سفارش فقط به حساب کاربر واردشده متصل می‌شود
    const { error } = await db
      .from('sc_orders')
      .insert([{
        order_number: orderNumber,
        player_name: player,
        rank_name: rank,
        price: prices[rank],
        status: 'pending',
        user_id: user.id
      }]);

    if (error) throw error;

    form.reset();
    closeOrderModal();
    showToast('سفارش ثبت شد! شماره سفارش: ' + orderNumber);

  } catch (error) {
    console.error('Order error:', error);

    if (error.code === '42501') {
      showMessage('دسترسی ثبت سفارش رد شد. سیاست‌های امنیتی جدول sc_orders را در Supabase بررسی کن.');
    } else if (error.code === '42703') {
      showMessage('ستون موردنیاز در جدول sc_orders پیدا نشد. نام ستون‌ها را بررسی کن.');
    } else {
      showMessage('ثبت سفارش ناموفق بود. اتصال اینترنت و خطای Console را بررسی کن.');
    }

  } finally {
    submitButton.disabled = false;
    submitButton.textContent = 'ثبت سفارش رایگان';
  }
});
</script>
